[package]
name = "catplay_android"
version = "0.1.0"
edition = "2024"

# Built as a member of the catplay workspace (see ../build-daemon.sh), so the workspace
# [patch] / Cargo.lock / release profile apply.
[dependencies]
catplay_carplay = { path = "../carplay/catplay_carplay" }
catplay_carplay_tx_gadget = { path = "../catplay_carplay_tx_gadget" }
catplay_hap = { path = "../core/catplay_hap" }
catplay_util = { path = "../core/catplay_util" }
catplay_tracing = { path = "../core/catplay_tracing" }
tokio = { version = "1.48.0", features = ["rt", "net", "io-util", "macros", "time"] }
log = "0.4.28"
libc = "0.2.183"
bytes = "1.10.1"
# catplay_hap (default features) needs OpenSSL; build it from source for the musl target
openssl = { version = "0.10.75", features = ["vendored"] }
